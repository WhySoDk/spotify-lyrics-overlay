name: Release

# push a version tag (e.g. git tag v1.2.0 && git push origin v1.2.0) to publish a release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: .\build.cmd
        shell: cmd

      - name: Publish the release
        run: gh release create "${{ github.ref_name }}" release/spotify-lyrics-overlay.exe --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
